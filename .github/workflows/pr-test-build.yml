name: Build and test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Check dashboard
        working-directory: dashboard
        run: |
          bun install --frozen-lockfile
          bun run check
          bun test
      - name: Test VPXY modules
        run: go test ./internal/api/... ./internal/config/... ./internal/quota/... ./internal/access/... ./sdk/cliproxy/...
      - name: Build embedded console and server
        run: go build -o test-output ./cmd/server
